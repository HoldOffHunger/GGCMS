#  Example GGCMS front end: nginx on 80/443, Apache serving renders on 8443.
#
#  Copy to /etc/nginx/sites-available/, replace every ***YOUR_..._HERE***
#  placeholder, and link it into sites-enabled.  nginx refuses to start while
#  any placeholder remains.  The shared part at the top is written once; repeat the three
#  server blocks at the bottom for each site.  Pair it with nginx.conf.example,
#  which carries the settings this file cannot reach.
#
#  What this buys: nginx answers page-cache hits and static files itself, in
#  milliseconds, without waking an Apache process.  Only genuine renders reach
#  the engine, and those wait in a queue here rather than in Apache's.
#
#  The cache tests must stay identical to PageCache::IsCacheable_* and to
#  var/www/html/.htaccess: GET only, no query string, no session cookie.
#
#  No `if` inside a location.  `if` alongside try_files is nginx's documented
#  broken combination.  Cacheability is decided by a map that picks a directory
#  name that does not exist when a request may not be cached, so try_files
#  simply falls through to the engine.

map $http_cookie $ggcms_session {
	default                            0;
	"~*(loggedin|AuthenticationToken)" 1;
}

	#  The cached file's suffix mirrors the format, not the URL:
	#  PageCache::CacheSuffix decides this and the two must agree.

map $uri $ggcms_cache_suffix {
	default    ".html";
	"~\.css$" ".css";
	"~\.brf$" ".brf";
}

map "$request_method:$is_args:$ggcms_session" $ggcms_cache_dir {
	default    "_nocache_never_exists";
	"GET::0"   "_cache";
}

	#  A path with no trailing slash is the same page at a second URL, and
	#  relative links on it resolve one level too high -- which is how crawlers
	#  come to invent ever-deeper paths.  A dot anywhere disqualifies the path,
	#  which keeps view.php, robots.txt and favicon.ico out of it.

map $uri $ggcms_needs_slash {
	default                        0;
	"~^/([^./]+/){0,5}[^./]+$"     1;
}

	#  One connection slot per client, and one render budget for the whole
	#  host.  Keyed on a constant, not on the site: there is one CPU behind all
	#  of the sites, and a budget per site multiplies the limit by the number
	#  of sites.  Size the rate to what the engine actually sustains.

limit_conn_zone $binary_remote_addr zone=ggcms_perip:10m;

map $host $ggcms_engine_key {
	default "engine";
}

limit_req_zone $ggcms_engine_key zone=ggcms_engine_rate:10m rate=15r/s;

	#  Serve the page cache pre-compressed.  PageCache writes a .gz beside each
	#  page, so compression happens once rather than on every request.

gzip_static on;
gzip_vary on;

	#  THE max IS A FILE DESCRIPTOR COUNT, NOT A HINT.  Raise it only together
	#  with worker_rlimit_nofile in nginx.conf, or it exhausts a worker's
	#  descriptors once the page cache grows, hours after the deploy.

open_file_cache max=512 inactive=120s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors on;

	#  max_conns keeps Apache from being asked for more than it has workers;
	#  the rest wait here, where a waiting connection costs kilobytes.
	#  max_fails=0 matters with a single backend: the default lets one slow
	#  request mark the only server down, and nginx then answers 502 to
	#  everything.  No keepalive while several server blocks share this
	#  upstream: a pooled TLS connection opened for one domain is reused for
	#  another and Apache answers 421 Misdirected Request.

upstream ggcms_engine {
	server 127.0.0.1:8443 max_fails=0 max_conns=30;
}

	#  Plain HTTP: certificates, then everything to HTTPS.

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	location /.well-known/acme-challenge/ { root /var/www/html; }

	location / { access_log off; return 301 https://$host$request_uri; }
}

	#  One canonical hostname per site.  The page cache is keyed on the host,
	#  so a site reachable both with and without www. fills two
	#  complete trees of identical pages and halves its own hit rate.

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.***YOUR_DOMAIN_HERE***;

	ssl_certificate     /etc/letsencrypt/live/***YOUR_DOMAIN_HERE***/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/***YOUR_DOMAIN_HERE***/privkey.pem;

	location /.well-known/acme-challenge/ { root /var/www/html; }

	location / { access_log off; return 301 https://***YOUR_DOMAIN_HERE***$request_uri; }
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name ***YOUR_DOMAIN_HERE***;

	ssl_certificate     /etc/letsencrypt/live/***YOUR_DOMAIN_HERE***/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/***YOUR_DOMAIN_HERE***/privkey.pem;

	root /var/www/html;
	limit_conn ggcms_perip 24;

		#  Server level with a bare return: the one form of `if` the nginx
		#  authors call safe.

	if ($ggcms_needs_slash) { return 301 $scheme://$host$uri/$is_args$args; }

	location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

		#  A path ten segments deep is not a page, it is a crawler walking a
		#  graph it invented.  Answered here it costs nothing; proxied, it
		#  costs a render slot.  Measure your own deepest real page and
		#  tighten this per site -- keep css/, image/ and javascript/ excused
		#  in any stricter rule, since real assets live deeper than pages.

	location ~ "^/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+/[^/]+" {
		access_log off;
		return 404;
	}

		#  Real files in the docroot -- the shared stylesheets, scripts and
		#  images -- are served here without waking Apache.  Anything that is
		#  not a file on disk falls through exactly as before: the generated
		#  display.css to the page cache, and per-site favicons, manifests and
		#  entry images to the engine.  After the depth rules on purpose, so
		#  junk paths that merely end in .css or .jpg still cost nothing.

	location ~* "\.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$" {
		try_files $uri /$ggcms_cache_dir/***YOUR_DOMAIN_HERE***$uri$ggcms_cache_suffix @engine;
		add_header Cache-Control "public, max-age=14400";
	}

		#  The page cache: a directory URL as <path>/index.html, anything else
		#  as <path> plus the format suffix, then the engine.  The header
		#  applies only to what is served from the cache; PageCache sends the
		#  same one itself on renders it would store.

	location / {
		try_files /$ggcms_cache_dir/***YOUR_DOMAIN_HERE***$uri/index.html /$ggcms_cache_dir/***YOUR_DOMAIN_HERE***$uri$ggcms_cache_suffix @engine;
		add_header Cache-Control "public, max-age=14400";
	}

	location @engine {
		limit_req zone=ggcms_engine_rate burst=30 nodelay;

		proxy_pass https://ggcms_engine;

			#  HTTP/1.1 to the backend: as HTTP/1.0 a response Apache sends
			#  whole can arrive empty.
		proxy_http_version 1.1;

			#  Name the site in the TLS handshake, and never reuse a session
			#  opened for another site on the shared upstream.
		proxy_ssl_session_reuse off;
		proxy_ssl_verify      off;
		proxy_ssl_name        ***YOUR_DOMAIN_HERE***;
		proxy_ssl_server_name on;

		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Server "";		#  a request header; GGCMS must never be told its site by the client
		proxy_read_timeout 60s;
	}
}
